    <text x="90" y="328" xml:space="preserve"><tspan class="kw">if</tspan><tspan class="fg"> </tspan><tspan class="bl">__name__</tspan><tspan class="fg"> </tspan><tspan class="kw">==</tspan><tspan class="fg"> </tspan><tspan class="st">"__main__"</tspan><tspan class="fg">:</tspan></text>

