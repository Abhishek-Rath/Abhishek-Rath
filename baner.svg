    <text x="90" y="148"><tspan class="bl" font-style="italic">class</tspan><tspan class="fg"> </tspan><tspan class="gr">Abhishek</tspan><tspan class="fg">:</tspan></text>

    <text x="90" y="178" xml:space="preserve"><tspan class="fg">    role   </tspan><tspan class="kw">=</tspan><tspan class="fg"> </tspan><tspan class="st">"Software Engineer"</tspan></text>

    <text x="90" y="208" xml:space="preserve"><tspan class="fg">    skills </tspan><tspan class="kw">=</tspan><tspan class="fg"> [</tspan><tspan class="st">"distributed systems"</tspan><tspan class="fg">, </tspan><tspan class="st">"backend"</tspan><tspan class="fg">, </tspan><tspan class="st">"python"</tspan><tspan class="fg">,</tspan></text>

